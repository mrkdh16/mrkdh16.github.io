# ─────────────────────────────────────────────────────────────────
# quest-log.yaml  —  Quest Log content data
# mrkdh16.github.io/quest-log.html
#
# Edit this file to update all page content. The page loads and
# parses this file at runtime; no code changes needed.
#
# ── SCHEMA ────────────────────────────────────────────────────────
#
# meta
#   .season        string   Subtitle shown in page header
#   .lastUpdated   string   ISO date (YYYY-MM-DD) for footer
#   .level         string   Footer flavor badge text
#
# semester
#   .name          string   Display name (e.g. "Spring 2026")
#   .start         string   ISO date — first day of classes
#   .end           string   ISO date — last day of finals
#   .milestones[]
#     .date        string   ISO date
#     .label       string   Short label (≤6 chars)
#
# stats[]          RPG-style stat bars shown as a compact panel
#   .label         string   2–3 char abbreviation (e.g. "INT")
#   .name          string   Full name shown in tooltip
#   .value         number   Current value
#   .max           number   Max value (bar fills to value/max)
#   .display       string   Human-readable label shown on row
#
# semesterGoals[]  Resets each term. Completed items stay visible.
#   .name          string   Short goal title
#   .sub           string   Course code, project, or context
#   .status        string   "done" | "wip" | "todo"
#   .detail        string   Tooltip body text (multi-line OK)
#   .tags          string[] Optional tags (reserved for filtering)
#
# yearGoals[]      Resets each year. Completed items stay visible.
#   .text          string   Goal description
#   .status        string   "done" | "wip" | "todo"
#   .detail        string   Tooltip body text
#   .completedDate string   Optional ISO date shown in tooltip
#
# longtermGoals[]  Never resets. Completed items hidden by default.
#   .name          string   Goal name
#   .sub           string   Sub-label or timeframe
#   .status        string   "done" | "wip" | "todo"
#   .detail        string   Tooltip body text
#   .completedDate string   Optional ISO date
#
# quotes[]         Strings for the avatar speech bubble easter egg
#
# ─────────────────────────────────────────────────────────────────

